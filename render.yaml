services:
  - type: web
    name: emotions-in-transit
    env: node
    buildCommand: "npm install && npm run build"
    startCommand: "node server/app.js"
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
    region: frankfurt
    healthCheckPath: /
    numInstances: 1
    