<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emotions (in) Transit | Thesis Build</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/handsfree@8.5.1/build/lib/assets/handsfree.css" />
    <script src="https://unpkg.com/handsfree@8.5.1/build/lib/handsfree.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
      body { 
          margin: 0; padding: 0; overflow: hidden; 
          background: #000; font-family: 'Inter', sans-serif;
      }
      canvas { display: block; }
      
      /* EFECTO CRT SCANLINES */
      body::after {
          content: "";
          position: absolute;
          top: 0; left: 0; width: 100vw; height: 100vh;
          background: repeating-linear-gradient(
            0deg,
            rgba(0, 0, 0, 0.2) 0px,
            rgba(0, 0, 0, 0.2) 1px,
            transparent 1px,
            transparent 3px
          );
          pointer-events: none; z-index: 10; opacity: 0.6;
      }
      .handsfree-debugger { display: none !important; }
    </style>
</head>
<body>

<script>
// ==========================================
// CONFIGURACIÓN Y ESTADO
// ==========================================
const RENDER_API_URL = 'https://emotions-in-transit-m2ts.onrender.com/api/emotions';
const OWM_KEY = "09a95abe51374eae766a284a97a3f039";
const TMB_APP_ID = "daf62db0";
const TMB_APP_KEY = "5e4adb21bdfeda65a91e36cc2c12b7df";

let cellSize = 25; 
let metroColors = ['#E10D16', '#79247D', '#008641', '#FFB200', '#005FA4', '#F37735', '#FFFFFF'];
let zOff = 0;

let weatherData = { temp: "--", hum: "--", desc: "SINCRO..." };
let transportData = { lines: 0, status: "CONECTANDO" };
let emotionData = { label: "NEUTRAL", intensity: 0.5 };

let handsfree;
let handX = 0, handActive = false;
let currentWaveAmp = 20;

// ==========================================
// P5 SETUP
// ==========================================
function setup() {
  createCanvas(windowWidth, windowHeight);
  frameRate(12); 
  strokeCap(PROJECT);
  textFont('Inter');
  
  handsfree = new Handsfree({ 
    hands: { enabled: true, maxNumHands: 1 }, 
    showDebug: false 
  });
  handsfree.start();

  fetchAllAPIs();
  setInterval(fetchAllAPIs, 300000);
}

function draw() {
  background(0);
  updateHand();

  let stripH = height / 3;

  // --- FRANJA 1: WEATHER ---
  push();
  drawWeatherStrip(width, stripH);
  pop();

  // --- FRANJA 2: TRANSIT (Sin texto TMB grande) ---
  push();
  translate(0, stripH);
  drawTransitGlitch(width, stripH);
  pop();

  // --- FRANJA 3: EMOTIONS ---
  push();
  translate(0, stripH * 2);
  drawEmotionStrip(width, stripH);
  pop();

  zOff += 0.003;
}

// ==========================================
// FRANJA 2: TRANSIT (LÓGICA ACTUALIZADA)
// ==========================================
function drawTransitGlitch(w, h) {
  // Fondo de Grid Glitch
  for (let x = 0; x < w; x += cellSize) {
    for (let y = 0; y < h; y += cellSize) {
      let selector = random(1);
      if (selector < 0.6) {
        drawCircuitLine(x, y);
      } else {
        drawColorBlock(x, y);
      }
    }
  }

  // Solo mantenemos el texto "(In)" interactivo
  fill(255); noStroke();
  textStyle(BOLD);
  textAlign(CENTER, CENTER);
  let inSize = constrain(h * 0.5, 50, 150);
  textSize(inSize);
  text("(In)", handX, h / 2);

  // Etiqueta técnica en la esquina
  drawLabel("TRANSIT_DATA_STREAM", `METRO_BCN: ${transportData.status} | ACTIVE_LINES: ${transportData.lines}`, 25, 25);
}

function drawCircuitLine(x, y) {
  stroke(255);
  strokeWeight(2);
  if (random(1) > 0.5) {
    line(x, y, x + cellSize, y + cellSize);
  } else {
    line(x + cellSize, y, x, y + cellSize);
  }
}

function drawColorBlock(x, y) {
  noStroke();
  fill(random(metroColors));
  rect(x, y, cellSize, cellSize);
  
  let detailType = random(1);
  if (detailType < 0.3) {
    fill(0);
    rect(x + cellSize * 0.25, y + cellSize * 0.25, cellSize * 0.5, cellSize * 0.5);
  }
}

// ==========================================
// OTRAS VISUALES
// ==========================================
function drawWeatherStrip(w, h) {
  let scale = 30;
  for (let i = 0; i < w/scale; i++) {
    for (let j = 0; j < h/scale; j++) {
      let n = noise(i * 0.04, j * 0.04, zOff);
      fill(obtenerColorClima(n)); noStroke();
      rect(i * scale, j * scale, scale, scale);
      
      push();
      translate(i * scale + scale/2, j * scale + scale/2);
      rotate(map(n, 0, 1, 0, TWO_PI*2) + (handActive ? map(handX, 0, width, -PI, PI) : 0));
      stroke(0, 100); strokeWeight(1.2);
      line(-scale*0.3, 0, scale*0.3, 0);
      pop();
    }
  }
  drawLabel("WEATHER_SYSTEM", `${weatherData.temp}°C | ${weatherData.desc}`, 25, 25);
}

function drawEmotionStrip(w, h) {
  let targetAmp = handActive ? 5 : map(emotionData.intensity, 0, 1, 10, h * 0.4);
  currentWaveAmp = lerp(currentWaveAmp, targetAmp, 0.1);
  stroke(255); noFill(); strokeWeight(2);
  beginShape();
  for (let x = 0; x <= w; x += 20) {
    let y = h/2 + sin(x * 0.05 + frameCount * 0.2) * (currentWaveAmp * noise(x * 0.01, zOff));
    vertex(x, y);
  }
  endShape();
  drawLabel("EMOTION_FLOW", `ENTITY_STATUS: ${emotionData.label}`, 25, 25);
}

function obtenerColorClima(val) {
  let palette = [color(0,0,255), color(0,255,255), color(0,255,0), color(255,255,0), color(255,0,0), color(100,0,100), color(20)];
  let idx = floor(map(val, 0, 1, 0, palette.length - 1));
  return lerpColor(palette[idx], palette[min(idx+1, palette.length-1)], (val * (palette.length-1)) % 1);
}

function drawLabel(title, val, x, y) {
  fill(0, 200); noStroke();
  rect(x - 5, y - 5, 280, 45, 2);
  fill(255); textAlign(LEFT, TOP);
  textStyle(BOLD); textSize(12); text(title, x, y);
  textStyle(NORMAL); textSize(10); text(val, x, y + 16);
}

// ==========================================
// HANDS & APIS
// ==========================================
function updateHand() {
  if (handsfree?.data?.hands?.landmarks?.[0]?.[8]) {
    handActive = true;
    handX = lerp(handX, (1 - handsfree.data.hands.landmarks[0][8].x) * width, 0.2);
  } else {
    handActive = false;
    handX = lerp(handX, width / 2, 0.05);
  }
}

async function fetchAllAPIs() {
  try {
    const resW = await fetch(`https://api.openweathermap.org/data/2.5/weather?id=3128760&appid=${OWM_KEY}&units=metric`);
    const dW = await resW.json();
    weatherData = { temp: floor(dW.main.temp), hum: dW.main.humidity, desc: dW.weather[0].main.toUpperCase() };

    const resT = await fetch(`https://api.tmb.cat/v1/transit/linies/metro?app_id=${TMB_APP_ID}&app_key=${TMB_APP_KEY}`);
    const dT = await resT.json();
    if(dT.features) transportData = { lines: dT.features.length, status: "ONLINE" };

    const resE = await fetch(RENDER_API_URL);
    const dE = await resE.json();
    emotionData = { label: dE.emotion.toUpperCase(), intensity: dE.intensity };
  } catch (e) { console.error("API Error", e); }
}

function windowResized() { resizeCanvas(windowWidth, windowHeight); }
</script>

</body>
</html>
